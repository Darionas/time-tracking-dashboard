<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Frontend Mentor | Time tracking dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300..500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>  
</head>
<body>
    <header class='sr-only'>
        <h1>Time Tracking Dashboard</h1>
    </header>
    <main class="main__content">
        <div class="dashboard">
            <div class="dashboard__sidebar">
                <div class="avatar__container">
                    <img class="avatar__image" src="./images/image-jeremy.png" alt="Jeremy Robson" />
                    <div class="avatar__owner">
                        <p class="text__preset-6 avatar__pre-text">Report for</p>
                        <p class="avatar__name text__preset-2">Jeremy Robson</p>
                    </div>
                </div>
                <div class="timing__filter">
                    <button class="timing__filter-btn text__preset-5R" type="button">Daily</button>
                    <button class="timing__filter-btn timing__filter-btn--active text__preset-5R" type="button">Weekly</button>
                    <button class="timing__filter-btn text__preset-5R" type="button">Monthly</button>
                </div>
            </div>
            <div class="dashboard__content">
                <div class="activity__card">
                    <div class="activity__image">
                        <img class="activity__icon" src="./images/icon-work.svg" alt="" />
                    </div> 
                    <div class="activity__content">
                        <button class="activity__btn">
                            <p class="activity__btn-title text__preset-5M">Work</p>
                            <div class="activity__menu">
                                <p class="oval"></p>
                                <p class="oval"></p>
                                <p class="oval"></p>
                            </div>
                        </button>
                        <div class="activity__tracking-time">
                            <p class="activity__hours text__preset-1">132hrs</p>
                            <p class="activity__total-hours text__preset-6">Last Week - 36hrs</p>
                        </div>
                    </div>
                </div>
                <div class="activity__card">
                    <div class="activity__image">
                        <img class="activity__icon" src="./images/icon-work.svg" alt="" />
                    </div> 
                    <div class="activity__content">
                        <button class="activity__btn">
                            <p class="activity__btn-title text__preset-5M">Work</p>
                            <div class="activity__menu">
                                <p class="oval"></p>
                                <p class="oval"></p>
                                <p class="oval"></p>
                            </div>
                        </button>
                        <div class="activity__tracking-time">
                            <p class="activity__hours text__preset-1">32hrs</p>
                            <p class="activity__total-hours text__preset-6">Last Week - 36hrs</p>
                        </div>
                    </div>
                </div>
                <div class="activity__card">
                    <div class="activity__image">
                        <img class="activity__icon" src="./images/icon-work.svg" alt="" />
                    </div> 
                    <div class="activity__content">
                        <button class="activity__btn">
                            <p class="activity__btn-title text__preset-5M">Work</p>
                            <div class="activity__menu">
                                <p class="oval"></p>
                                <p class="oval"></p>
                                <p class="oval"></p>
                            </div>
                        </button>
                        <div class="activity__tracking-time">
                            <p class="activity__hours text__preset-1">32hrs</p>
                            <p class="activity__total-hours text__preset-6">Last Week - 36hrs</p>
                        </div>
                    </div>
                </div>
                <div class="activity__card">
                    <div class="activity__image">
                        <img class="activity__icon" src="./images/icon-work.svg" alt="" />
                    </div> 
                    <div class="activity__content">
                        <button class="activity__btn">
                            <p class="activity__btn-title text__preset-5M">Work</p>
                            <div class="activity__menu">
                                <p class="oval"></p>
                                <p class="oval"></p>
                                <p class="oval"></p>
                            </div>
                        </button>
                        <div class="activity__tracking-time">
                            <p class="activity__hours text__preset-1">32hrs</p>

                    </div>
                </div>

                    </div> 
                    <div class="activity__content">
                        <button class="activity__btn">
                            <p class="activity__btn-title text__preset-5M">Work</p>
                            <div class="activity__menu">
                                <p class="oval"></p>

                                <p class="oval"></p>
                            </div>

                        <div class="activity__tracking-time">
                            <p class="activity__hours text__preset-1">32hrs</p>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
