<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Frontend Mentor | Time tracking dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300..500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>  
</head>
<body>
    <header class='sr-only'>
        <h1>Time Tracking Dashboard</h1>
    </header>
    <main class="main__content">
        <div class="dashboard">
            <div class="dashboard__sidebar">
                <div class="avatar__container">
                    <img class="avatar__image" src="./images/image-jeremy.png" alt="Jeremy Robson" />
                    <div class="avatar__owner">
                        <p class="text__preset-6 avatar__pre-text">Report for</p>
                        <p class="avatar__name text__preset-2">Jeremy Robson</p>
                    </div>
                </div>
                <div class="timing__filter">
                    <button class="timing__filter-btn timing__filter-btn--active text__preset-5R" 
                    type="button" aria-label="View daily statistics" aria-current="page">Daily</button>
                    <button class="timing__filter-btn text__preset-5R" type="button"
                    aria-label="View weekly statistics">Weekly</button>
                    <button class="timing__filter-btn text__preset-5R" type="button"
                    aria-label="View monthly statistics">Monthly</button>
                </div>
            </div>
            <div class="dashboard__content" id="dashboard__content-cardContainer"></div>
        </div>
    </main>
    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>. 
        Coded by <a href="https://www.frontendmentor.io/profile/Darionas">Darionas</a>.
    </footer>
</body>
</html>
